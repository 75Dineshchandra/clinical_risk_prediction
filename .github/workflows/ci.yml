name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"          # same as training and the container
          cache: pip
          cache-dependency-path: |
            serving/requirements-serve.txt
            requirements-dev.txt
      - name: Install (the serving pins, plus test tools)
        run: pip install -r serving/requirements-serve.txt -r requirements-dev.txt
      - name: Lint (real errors only: syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile name (Linux is case-sensitive)
        run: test -f serving/Dockerfile || (echo "serving/Dockerfile is missing or has the wrong case" && exit 1)
      - name: Build the API image
        run: docker build -t readmission-api:ci ./serving
      - name: Build the drift exporter image
        run: docker build -t readmission-drift:ci -f monitoring/Dockerfile.drift ./monitoring
